<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SparkOS Boot</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#20252b}
body{display:grid;place-items:center}
.boot{width:100vw;height:100vh;display:grid;place-items:center}
.logo{width:min(18vw,180px);min-width:90px;filter:drop-shadow(0 0 18px rgba(255,255,255,.08));animation:pulse 2.2s ease-in-out infinite}
.mark{fill:#fff}
.wordmark{fill:#fff;font:700 62px Arial,sans-serif;letter-spacing:12px;opacity:0;animation:wordmark 1.2s ease-out .25s forwards}
.dot{fill:#fff;animation:dot 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(.82);opacity:.55}50%{transform:scale(1);opacity:1}}
@keyframes wordmark{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes dot{0%,100%{r:2;opacity:.45}50%{r:7;opacity:1}}
@media(prefers-reduced-motion:reduce){.logo,.wordmark,.dot{animation:none}.wordmark{opacity:1}.dot{r:4}}
</style>
</head>
<body>
<main class="boot" aria-label="SparkOS boot animation">
<svg class="logo" viewBox="0 0 720 430" role="img" aria-label="SparkOS">
<g transform="translate(360 155)"><path class="mark" d="M34-150-150 85h124l-27 180L165 2H31z"/></g>
<text class="wordmark" x="360" y="350" text-anchor="middle">SPARKOS</text>
<circle class="dot" cx="360" cy="395" r="2"/>
</svg>
</main>
<script>document.documentElement.dataset.sparkOSBoot="ready";</script>
</body>
</html>
