# SparkOS default keyboard shortcuts (human-readable source of truth).
# Chromebook Search is treated as the SparkOS launcher modifier (Search/Super).
# Bindings are intended to be user-configurable.
# Search+Tab+A is reserved for the future Code development exit sequence; inactive for now.

[apps]
"Search+Space" = "open-launcher"
"Search+E" = "launch:files"
"Search+C" = "launch:chrome"
"Search+S" = "launch:settings"
"Search+I" = "launch:spark-ai"
"Search+T" = "launch:terminal"
"Search+1..9" = "launch-pinned-slot:1..9"

[windows]
"Alt+F4" = "close-focused-window"
"Alt+Tab" = "switch-window"
"F11" = "toggle-maximize"
"Search+Tab" = "open-task-view"
"Search+D" = "show-desktop"
"Search+Left" = "previous-workspace"
"Search+Right" = "next-workspace"

[system]
"Search+Q" = "quick-settings"
"Search+N" = "notifications"

[mouse]
"Left" = "activate-pointer-target"
"Right" = "show-context-menu"
"Back" = "navigate-back"
"Forward" = "navigate-forward"
"Wheel" = "scroll-vertical"
"Shift+Wheel" = "scroll-horizontal"
