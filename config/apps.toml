# SparkOS stable app IDs and display metadata.
# Launch targets are IDs, never arbitrary command strings.
# The session manager resolves each ID to an installed, verified application.

[files]
name = "Files"
category = "system"
pinned_default = true

[settings]
name = "Settings"
category = "system"
pinned_default = true

[chrome]
name = "Google Chrome"
category = "internet"
pinned_default = true
launch_policy = "verified-installed-app"

# SparkOS does not bundle Google Chrome. The app manager must detect a compatible
# official installation and show a clear unavailable message when none exists.

[terminal]
name = "Terminal"
category = "development"
pinned_default = false

[spark-ai]
name = "Spark AI"
category = "assistant"
pinned_default = false
start_on_demand = true

[task-manager]
name = "Task Manager"
category = "system"
pinned_default = false
start_on_demand = true
