<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SparkOS App Open Animation</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#20252b}
body{display:grid;place-items:center}
.app{width:min(900px,86vw);height:min(560px,70vh);background:#303740;border-radius:20px;box-shadow:0 20px 55px rgba(0,0,0,.32);transform-origin:center;animation:open .28s cubic-bezier(.2,.8,.2,1) both}
.glow{position:absolute;width:100%;height:100%;border-radius:20px;pointer-events:none;animation:glow .28s ease-out both}
@keyframes open{
0%{transform:scale(.94);opacity:0;filter:blur(4px)}
55%{transform:scale(1.015);opacity:1;filter:blur(0)}
100%{transform:scale(1);opacity:1;filter:blur(0)}
}
@keyframes glow{
0%{box-shadow:0 0 0 rgba(255,255,255,0)}
50%{box-shadow:0 0 28px rgba(255,255,255,.16)}
100%{box-shadow:0 0 0 rgba(255,255,255,0)}
}
@media(prefers-reduced-motion:reduce){
.app,.glow{animation:none}
.app{opacity:1;transform:none}
}
</style>
</head>
<body>
<main class="app" aria-label="SparkOS application opening">
<div class="glow"></div>
</main>
</body>
</html>
